name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Catraca de UI: falha se a dívida de componente SUBIR. Não exige zero —
      # a migração é gradual; o que não pode é regredir enquanto ela anda.
      - name: Dívida de UI
        run: npm run verificar:ui

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders para o build não falhar por env ausente na CI.
          # Valores reais ficam nos secrets do repositório quando necessário.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3008

  # AVISO DE SUPERFÍCIE MEDIDA.
  #
  # Nem tudo neste repositório tem o mesmo risco. Mexer num botão do admin um
  # teste pega; mexer numa descrição de ferramenta, num prompt ou no chunker
  # muda a assertividade do chat e NENHUM teste pega — o efeito só aparece no
  # eval, que precisa do banco e por isso roda agendado, não a cada PR.
  #
  # Este job não bloqueia. Ele diz o que foi tocado e qual comando mede aquilo,
  # porque o defeito recorrente aqui não é gente contrariando a medição: é gente
  # (eu inclusive) esquecendo que aquele arquivo era medido.
  #
  # `BASE` é um SHA vindo do evento, passado por env e usado entre aspas —
  # nunca interpolar `${{ }}` dentro de `run:`, que é como texto de terceiro
  # vira comando.
  superficie-medida:
    runs-on: ubuntu-latest
    # Roda em PR *e* em push. Antes era só `pull_request`, e quem empurrava
    # direto para `main` não recebia aviso nenhum — foi o que aconteceu em
    # 06/09 com a compactação de resultado de ferramenta. Em push a base é
    # `event.before`; num primeiro push (ou force-push) ela vem zerada, e aí o
    # passo se declara inconclusivo em vez de comparar contra o vazio e jurar
    # que nada foi tocado.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: O que este PR toca
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          VAZIO=0000000000000000000000000000000000000000
          if [ -z "${BASE:-}" ] || [ "$BASE" = "$VAZIO" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning title=Superficie medida::Sem base comparavel (primeiro push ou force-push). NAO da para dizer o que foi tocado."
            echo "  -> rode a conferencia a mao: git diff --name-only <base>...HEAD"
            exit 0
          fi
          mudou() { git diff --name-only "$BASE"...HEAD | grep -qE "$1"; }
          aviso() { echo "::warning title=Superficie medida::$1"; echo "  -> $1"; }

          echo "Arquivos alterados:"
          git diff --name-only "$BASE"...HEAD | sed 's/^/  /'
          echo

          tocou=0
          if mudou '^src/lib/integrations/(tool-narrow|tool-catalog|tool-catalog-text|tool-builder|teto-tools|panel-scope|module-select|module-match|cobertura|facets|aprendizado|rank-resgate)\.ts$'; then
            aviso "Funil de ferramentas alterado. Meca: npm run eval:tools -- --casos eval/cenarios.jsonl"
            aviso "LEMBRE: eval:tools roda simTools+selecionarTopK com teto proprio de 12, NAO o buildIntegrationTools de producao (MAX_TOOLS_MODELO=6, teto de verdade, desempate, dependencias). Para o funil ponta a ponta use: npm run eval:cenarios-modelo -- --funil"
            tocou=1
          fi
          # O que o modelo LE de cada resultado de ferramenta. Ficou de fora da
          # lista ate 22/09, e foi por esse buraco que a compactacao de linhas
          # (-47,8% por linha, mudanca de FORMA do que o modelo recebe) entrou
          # sem nenhum aviso.
          if mudou '^src/lib/chat/(datasets|compactar-linhas|column-select|query-tools)\.ts$'; then
            aviso "Resultado de ferramenta que vai ao MODELO foi alterado. Meca token e truncamento: .audit/tool-result-compacto-ab.ts e .audit/tool-result-peso-morto.ts"
            tocou=1
          fi
          # Portoes puros: decidem se o turno para para perguntar. Sao medidos
          # contra turno real, nao contra o eval de ferramenta.
          if mudou '^src/lib/chat/(periodo|entrega|portao-acao|portao-acao-confirma|procedencia)\.ts$'; then
            aviso "Portao do chat alterado. Meca contra turno real: npm run eval:cenarios-modelo"
            tocou=1
          fi
          if mudou '^src/lib/(ai/rag|ai/ontology|content/chunk)'; then
            aviso "Recuperacao ou fatiamento alterado. Meca: npx tsx --env-file=.env.local scripts/eval-rag.ts"
            tocou=1
          fi
          if mudou '^supabase/migrations/.*hybrid_search'; then
            aviso "Busca hibrida alterada. Meca recall E tempo: eval-rag + EXPLAIN ANALYZE"
            tocou=1
          fi
          if mudou '^src/lib/ai/(prompts|prompt-split|prompt-cascade|system-prompt|anthropic-cache)'; then
            aviso "Prompt alterado. Meca os dois eixos: eval:tools e eval-rag"
            tocou=1
          fi
          if mudou '^eval/.*\.jsonl$'; then
            aviso "GABARITO alterado: placares novos NAO sao comparaveis com os antigos. O checksum em ai_eval_runs vai divergir, e eval:comparar avisa."
            tocou=1
          fi

          if [ "$tocou" -eq 0 ]; then
            echo "Nenhuma superficie medida foi tocada."
          else
            echo
            echo "Depois de medir, a rodada fica gravada em ai_eval_runs."
            echo "Compare com a anterior: npm run eval:comparar"
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      # O `.env` DESTE REPOSITÓRIO É O DE PRODUÇÃO, e é versionado de propósito
      # (ver a exceção no .gitignore). Logo o checkout da CI o traz, com
      # `NEXT_PUBLIC_BASE_PATH=/natcorp/ia` — e o `next build` assa esse prefixo
      # em todas as rotas. O e2e navega por caminho ABSOLUTO
      # (`page.goto("/admin/login")`), que ignora prefixo, e ia bater em 404.
      #
      # Foi isto que manteve o e2e vermelho de 18/08 a 28/08. Zerar aqui é o que
      # faz a CI testar o app na configuração que os testes assumem; variável de
      # ambiente vence o `.env`, e precisa estar nos DOIS passos porque o build
      # assa e o servidor serve.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3008
          NEXT_PUBLIC_BASE_PATH: ""

      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3008
          NEXT_PUBLIC_BASE_PATH: ""
